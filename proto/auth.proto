syntax = "proto3";
package ecommerce.auth;
import "common.proto";
service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc VerifyToken(TokenRequest) returns (Identity);
  rpc Health(ecommerce.common.Empty) returns (ecommerce.common.HealthResponse);
}
message RegisterRequest { string username = 1; string password = 2; string email = 3; string phone = 4; }
message RegisterResponse { int32 uid = 1; string message = 2; }
message LoginRequest { string username = 1; string password = 2; }
message LoginResponse { string accessToken = 1; string tokenType = 2; int32 expiresIn = 3; }
message TokenRequest { string token = 1; }
message Identity { int32 uid = 1; string role = 2; int64 exp = 3; }
